<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moritz Schule</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#EEF4F1;--card:#F8FBFA;--line:#CAD8D2;--dark:#35584D;--accent:#DDE8E3}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--dark);margin:0;padding:20px}.nav button{margin-right:8px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Schultasche vorbereiten</h1><div id="subtitle"></div><div class="nav"><button onclick="showPage('home')">Morgen vorbereiten</button><button onclick="showPage('plan')">Stundenplan</button><button onclick="showPage('settings')">Einstellungen</button></div><div id="home" class="page active"><div class="card" id="target"></div><div class="grid"><div class="card"><h3>Schulsachen</h3><div id="pack"></div><div id="packText"></div></div><div class="card"><h3>Hausaufgaben erledigt?</h3><div id="hw"></div><div id="hwText"></div></div></div></div><div id="plan" class="page"><div class="card"><pre id="plancontent"></pre></div></div><div id="settings" class="page"><div class="card">Name <input id="name"><br>Klasse <input id="klasse"><br><button onclick="saveSettings()">Speichern</button></div></div><script>const tt={Montag:{Mathe:['Buch','Heft','Schnellhefter','Arbeitsheft'],Geographie:['Buch','Schnellhefter'],Physik:['Buch','Heft','Schnellhefter'],BwR:['Buch','Schnellhefter'],Ethik:['Buch','Heft'],Englisch:['Buch','Schnellhefter','Arbeitsheft'],Geschichte:['Buch','Schnellhefter']},Dienstag:{Deutsch:['Buch','Heft','Arbeitsheft','Schnellhefter'],BwR:['Buch','Schnellhefter'],Mathe:['Buch','Heft','Schnellhefter','Arbeitsheft'],Musik:['Heft'],IT:['Heft']},Mittwoch:{BwR:['Buch','Schnellhefter'],Englisch:['Buch','Schnellhefter','Arbeitsheft'],Ethik:['Buch','Heft'],Deutsch:['Buch','Heft','Arbeitsheft','Schnellhefter'],WR:['Buch','Schnellhefter'],Geschichte:['Buch','Schnellhefter']},Donnerstag:{Englisch:['Buch','Schnellhefter','Arbeitsheft'],Deutsch:['Buch','Heft','Arbeitsheft','Schnellhefter'],Sport:['Sportsachen']},Freitag:{Englisch:['Buch','Schnellhefter','Arbeitsheft'],WR:['Buch','Schnellhefter'],Mathe:['Buch','Heft','Schnellhefter','Arbeitsheft'],Musik:['Heft'],Physik:['Buch','Heft','Schnellhefter'],Geographie:['Buch','Schnellhefter']}};function nextDay(){const d=new Date().getDay();return ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Montag','Montag'][d]}function reset(){const t=new Date().toDateString();if(localStorage.lastReset!==t){localStorage.removeItem('checks');localStorage.lastReset=t}}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}function saveSettings(){localStorage.studentName=name.value;localStorage.studentClass=klasse.value;loadSettings()}function loadSettings(){name.value=localStorage.studentName||'Moritz';klasse.value=localStorage.studentClass||'8b';subtitle.textContent=(localStorage.studentName||'Moritz')+' / Klasse '+(localStorage.studentClass||'8b')}reset();loadSettings();const day=nextDay();target.textContent='Vorbereitung für '+day;let plan='';Object.keys(tt).forEach(k=>plan+=k+': '+Object.keys(tt[k]).join(', ')+'
');plancontent.textContent=plan;const checks=JSON.parse(localStorage.checks||'{}');let total=0,done=0,ht=0,hd=0;Object.entries(tt[day]).forEach(([s,it])=>{let d=document.createElement('details');d.open=true;let h='<summary><b>'+s+'</b></summary>';it.forEach(m=>{let id='p_'+s+'_'+m;total++;if(checks[id])done++;h+='<label><input type=checkbox data-id='+id+' '+(checks[id]?'checked':'')+'> '+m+'</label><br>'});d.innerHTML=h;pack.appendChild(d);let row=document.createElement('div');let hid='h_'+s;ht++;if(checks[hid])hd++;row.innerHTML='<label><input type=checkbox data-id='+hid+' '+(checks[hid]?'checked':'')+'> '+s+'</label>';hw.appendChild(row)});document.addEventListener('change',e=>{if(e.target.dataset.id){checks[e.target.dataset.id]=e.target.checked;localStorage.checks=JSON.stringify(checks);location.reload()}});packText.textContent=done+' von '+total+' Materialien';hwText.textContent=hd+' von '+ht+' Fächern';if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script></body></html>
