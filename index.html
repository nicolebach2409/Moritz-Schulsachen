<!DOCTYPE html>
<html lang="de">
 
<head>
 
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
 
<title>Moritz Schule</title>
 
<link rel="manifest"
href="manifest.json">

<style>
 
:root{
--bg:#EEF4F1;
--card:#F8FBFA;
--line:#CAD8D2;
--dark:#35584D;
--accent:#DDE8E3;
}
 
*{
box-sizing:border-box;
}
 
body{
background:var(--bg);
color:var(--dark);
font-family:system-ui,sans-serif;
margin:0;
padding:20px;
}
 
h1{
margin:0 0 8px 0;
}
 
.subtitle{
margin-bottom:20px;
font-size:18px;
font-weight:600;
}
 
.nav{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}
 
button{
padding:10px 14px;
border-radius:10px;
border:1px solid var(--line);
cursor:pointer;
background:#fff;
}
 
.page{
display:none;
}
 
.page.active{
display:block;
}
 
.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:16px;
margin-bottom:16px;
}
 
.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:16px;
}
 
details{
margin-bottom:12px;
}
 
summary{
cursor:pointer;
font-weight:700;
margin-bottom:8px;
}
 
label{
display:block;
padding:4px 0;
}
 
.progress{
margin-top:16px;
}
 
.bar{
width:100%;
height:12px;
background:white;
border-radius:20px;
overflow:hidden;
border:1px solid var(--line);
}
 
.fill{
background:#5D8777;
height:100%;
width:0;
transition:.3s;
}
 
table{
width:100%;
border-collapse:collapse;
}
 
th,td{
border:1px solid var(--line);
padding:8px;
text-align:left;
}
 
input[type=text]{
width:100%;
padding:10px;
margin:8px 0 16px;
}
 
@media(max-width:900px){
 
.grid{
grid-template-columns:1fr;
}
 
}
 
</style>
 
</head>
<body>

<h1>Schultasche vorbereiten</h1>

<div id="subtitle"
     class="subtitle"></div>

<div class="nav">

<button onclick="showPage('homePage')">
🏠 Morgen vorbereiten
</button>

<button onclick="showPage('schedulePage')">
📅 Stundenplan
</button>

<button onclick="showPage('settingsPage')">
⚙️ Einstellungen
</button>

</div>

   <div id="homePage"
     class="page active">

<div class="card">
<strong id="targetDay"></strong>
</div>

<div class="grid">

<div class="card">

<h2>📚 Schulsachen</h2>

<div id="packList"></div>

<div class="progress">
<div id="packText"></div>

<div class="bar">
<div id="packBar"
     class="fill"></div>
</div>

</div>

</div>


<div class="card">

<h2>📝 Hausaufgaben erledigt?</h2>

<div id="homeworkList"></div>

<div class="progress">

<div id="hwText"></div>

<div class="bar">
<div id="hwBar"
     class="fill"></div>
</div>

</div>

</div>

</div>
</div>

   <div id="schedulePage"
     class="page">

<div class="card">

<h2>📅 Stundenplan</h2>

<table>

<tr>
<th>Montag</th>
<th>Dienstag</th>
<th>Mittwoch</th>
<th>Donnerstag</th>
<th>Freitag</th>
</tr>

<tr>
<td>Mathe</td>
<td>Deutsch</td>
<td>BWR</td>
<td>Englisch</td>
<td>Englisch</td>
</tr>

<tr>
<td>Geographie</td>
<td>BWR</td>
<td>Englisch</td>
<td>Deutsch</td>
<td>WR</td>
</tr>

<tr>
<td>Physik</td>
<td>Mathe</td>
<td>Ethik</td>
<td>Sport</td>
<td>Mathe</td>
</tr>

</table>

</div>
</div>

<div id="settingsPage"
     class="page">

<div class="card">

<h2>⚙️ Einstellungen</h2>

<label>Name</label>
<input type="text"
       id="nameInput">

<label>Klasse</label>
<input type="text"
       id="classInput">

<button onclick="saveSettings()">
Speichern
</button>

</div>
</div>
<script>

/* ==========================================
   DATEN
========================================== */

const timetable = {

  Montag:{
    Mathe:["Buch","Heft","Schnellhefter","Arbeitsheft"],
    Geographie:["Buch","Schnellhefter"],
    Physik:["Buch","Heft","Schnellhefter"],
    BwR:["Buch","Schnellhefter"],
    Ethik:["Buch","Heft"],
    Englisch:["Buch","Schnellhefter","Arbeitsheft"],
    Geschichte:["Buch","Schnellhefter"]
  },

  Dienstag:{
    Deutsch:["Buch","Heft","Arbeitsheft","Schnellhefter"],
    BwR:["Buch","Schnellhefter"],
    Mathe:["Buch","Heft","Schnellhefter","Arbeitsheft"],
    Musik:["Heft"],
    IT:["Heft"]
  },

  Mittwoch:{
    BwR:["Buch","Schnellhefter"],
    Englisch:["Buch","Schnellhefter","Arbeitsheft"],
    Ethik:["Buch","Heft"],
    Deutsch:["Buch","Heft","Arbeitsheft","Schnellhefter"],
    WR:["Buch","Schnellhefter"],
    Geschichte:["Buch","Schnellhefter"]
  },

  Donnerstag:{
    Englisch:["Buch","Schnellhefter","Arbeitsheft"],
    Deutsch:["Buch","Heft","Arbeitsheft","Schnellhefter"],
    Sport:["Sportsachen"]
  },

  Freitag:{
    Englisch:["Buch","Schnellhefter","Arbeitsheft"],
    WR:["Buch","Schnellhefter"],
    Mathe:["Buch","Heft","Schnellhefter","Arbeitsheft"],
    Musik:["Heft"],
    Physik:["Buch","Heft","Schnellhefter"],
    Geographie:["Buch","Schnellhefter"]
  }

};


/* ==========================================
   DOM
========================================== */

const subtitle =
document.getElementById("subtitle");

const targetDayLabel =
document.getElementById("targetDay");

const packList =
document.getElementById("packList");

const homeworkList =
document.getElementById("homeworkList");

const packText =
document.getElementById("packText");

const hwText =
document.getElementById("hwText");

const packBar =
document.getElementById("packBar");

const hwBar =
document.getElementById("hwBar");

const nameInput =
document.getElementById("nameInput");

const classInput =
document.getElementById("classInput");


/* ==========================================
   NAVIGATION
========================================== */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(function(page){

      page.classList.remove("active");

    });

  document
    .getElementById(id)
    .classList.add("active");
}


/* ==========================================
   NÄCHSTER SCHULTAG
========================================== */

function getNextSchoolDay(){

  const weekday = new Date().getDay();

  if(weekday === 0) return "Montag";
  if(weekday === 1) return "Dienstag";
  if(weekday === 2) return "Mittwoch";
  if(weekday === 3) return "Donnerstag";
  if(weekday === 4) return "Freitag";

  return "Montag";

}


/* ==========================================
   RESET
========================================== */

function dailyReset(){

  const today =
        new Date().toDateString();

  const lastReset =
        localStorage.getItem(
          "lastReset"
        );

  if(today !== lastReset){

      localStorage.removeItem(
        "checkState"
      );

      localStorage.setItem(
        "lastReset",
        today
      );
  }

}


/* ==========================================
   EINSTELLUNGEN
========================================== */

function loadSettings(){

  const studentName =
        localStorage.getItem(
            "studentName"
        ) || "Moritz";

  const studentClass =
        localStorage.getItem(
            "studentClass"
        ) || "8b";

  nameInput.value =
      studentName;

  classInput.value =
      studentClass;

  subtitle.textContent =
      studentName +
      " / Klasse " +
      studentClass;
}


function saveSettings(){

  localStorage.setItem(
      "studentName",
      nameInput.value
  );

  localStorage.setItem(
      "studentClass",
      classInput.value
  );

  loadSettings();

  alert("Gespeichert");

}


/* ==========================================
   CHECKBOXEN SPEICHERN
========================================== */

function saveChecks(){

  const state = {};

  document
    .querySelectorAll(
      "input[type='checkbox']"
    )
    .forEach(function(cb){

      state[cb.id] =
          cb.checked;

    });

  localStorage.setItem(
      "checkState",
      JSON.stringify(state)
  );

  updateProgress();

}


function loadChecks(){

  const state =
      JSON.parse(
      localStorage.getItem(
        "checkState"
      ) || "{}"
  );

  document
    .querySelectorAll(
      "input[type='checkbox']"
    )
    .forEach(function(cb){

      cb.checked =
          state[cb.id] === true;

    });

  updateProgress();

}


/* ==========================================
   FORTSCHRITT
========================================== */

function updateProgress(){

  const packBoxes =
      Array.from(
        document.querySelectorAll(
          ".pack"
        )
      );

  const hwBoxes =
      Array.from(
        document.querySelectorAll(
          ".hw"
        )
      );

  const packDone =
      packBoxes.filter(
        x => x.checked
      ).length;

  const hwDone =
      hwBoxes.filter(
        x => x.checked
      ).length;

  const packPercent =
      packBoxes.length > 0
      ? Math.round(
          packDone /
          packBoxes.length *
          100
        )
      : 0;

  const hwPercent =
      hwBoxes.length > 0
      ? Math.round(
          hwDone /
          hwBoxes.length *
          100
        )
      : 0;

  packText.textContent =
      packDone +
      " von " +
      packBoxes.length +
      " Materialien";

  hwText.textContent =
      hwDone +
      " von " +
      hwBoxes.length +
      " Fächern";

  packBar.style.width =
      packPercent + "%";

  hwBar.style.width =
      hwPercent + "%";

}


/* ==========================================
   LISTEN AUFBAUEN
========================================== */

function buildLists(){

  const day =
      getNextSchoolDay();

  targetDayLabel.textContent =
      "Vorbereitung für " +
      day;

  packList.innerHTML = "";
  homeworkList.innerHTML = "";

  Object.entries(
      timetable[day]
  ).forEach(function(entry){

      const subject =
            entry[0];

      const items =
            entry[1];

      const details =
          document.createElement(
            "details"
          );

      details.open = true;

      const summary =
          document.createElement(
            "summary"
          );

      summary.textContent =
          subject;

      details.appendChild(
          summary
      );

      items.forEach(function(item){

          const label =
              document.createElement(
                "label"
              );

          const checkbox =
              document.createElement(
                "input"
              );

          checkbox.type =
              "checkbox";

          checkbox.className =
              "pack";

          checkbox.id =
              "pack_" +
              subject +
              "_" +
              item;

          label.appendChild(
              checkbox
          );

          label.appendChild(
              document.createTextNode(
                  " " + item
              )
          );

          details.appendChild(
              label
          );

      });

      packList.appendChild(
          details
      );

      const hwLabel =
          document.createElement(
            "label"
          );

      const hwCheckbox =
          document.createElement(
            "input"
          );

      hwCheckbox.type =
          "checkbox";

      hwCheckbox.className =
          "hw";

      hwCheckbox.id =
          "hw_" +
          subject;

      hwLabel.appendChild(
          hwCheckbox
      );

      hwLabel.appendChild(
          document.createTextNode(
              " " + subject
          )
      );

      homeworkList.appendChild(
          hwLabel
      );

  });

  document
      .querySelectorAll(
          "input[type='checkbox']"
      )
      .forEach(function(cb){

          cb.addEventListener(
              "change",
              saveChecks
          );

      });

  loadChecks();
}


/* ==========================================
   START
========================================== */

dailyReset();

loadSettings();

buildLists();

if("serviceWorker" in navigator){

  navigator.serviceWorker.register(
      "sw.js"
  );

}

</script>

</body>
</html>
